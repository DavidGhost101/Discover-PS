name: Deploy to Firebase

# Manual: deploys firestore.rules, the Cloud Functions (owner protection + audit log) and the
# website (Firebase Hosting → https://<project-id>.web.app).
#
# Repository secrets:
#   FIREBASE_SERVICE_ACCOUNT  service-account JSON key (roles: Firebase Admin, Cloud Functions
#                             Admin, Service Account User, Cloud Build Editor, Artifact
#                             Registry Administrator). Cloud Functions need the Blaze plan.
#   FIREBASE_WEB_CONFIG       the web app's firebaseConfig object (public identifiers).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund
      - name: Deploy rules, functions and website
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_WEB_CONFIG" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT and FIREBASE_WEB_CONFIG repository secrets first."
            exit 1
          fi
          key="$RUNNER_TEMP/service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          project="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$key")"
          printf 'window.DISCOVER_PS_FIREBASE_CONFIG = %s;\n' "$FIREBASE_WEB_CONFIG" > web/firebase-config.js
          npx --yes firebase-tools@15 deploy --only firestore:rules,functions,hosting --project "$project" --non-interactive --force
          rm -f "$key"
          echo "Website: https://$project.web.app"
