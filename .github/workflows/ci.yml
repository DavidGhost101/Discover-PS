name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: tests/firestore-rules
        run: npm install --no-audit --no-fund
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund
      - name: Run rules, auth-flow and owner-security tests
        working-directory: tests/firestore-rules
        run: npm test

  web:
    name: Web portal (unit + browser E2E, desktop & mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: tests/web
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: tests/web
        run: npm run test:unit
      - name: Browser end-to-end tests against the Firebase emulators
        working-directory: tests/web
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          if-no-files-found: ignore

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Optional: repository secret GOOGLE_SERVICES_JSON (contents of app/google-services.json)
      # makes the uploaded APK talk to the school's Firebase project. Without it the APK
      # still builds and shows "Firebase is not configured".
      - name: Add Firebase config for the downloadable APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Build debug APK and instrumented tests
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Unit tests
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-configuration-cache :app:lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  e2e:
    name: End-to-end UI workflows (Android emulator + Firebase emulators)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Firebase emulator tooling
        working-directory: tests/firestore-rules
        run: npm install --no-audit --no-fund
      - name: Build app and test APKs
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented tests against the emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: cd tests/firestore-rules && npx firebase emulators:exec --only auth,firestore --project demo-discovery-primary "cd ../.. && ./gradlew --no-configuration-cache :app:connectedDebugAndroidTest"
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
