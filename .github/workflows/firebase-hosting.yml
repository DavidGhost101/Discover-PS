name: Website (Firebase Hosting)

# Publishes web/ to https://<project-id>.web.app and deploys firestore.rules + indexes.
# One-time setup (repository Settings → Secrets and variables → Actions):
#   FIREBASE_PROJECT_ID       the Firebase project ID, e.g. discovery-primary-12345
#   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with the "Firebase Admin" role
#                             (Google Cloud console → IAM & Admin → Service accounts)
#   FIREBASE_WEB_CONFIG       the firebaseConfig JSON of the project's Web app,
#                             e.g. {"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}
# Until the first two secrets exist the deploy is skipped instead of failing.
on:
  push:
    branches: [main]
    paths: ['web/**', 'firebase.json', 'firestore.rules', 'firestore.indexes.json', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_PROJECT_ID / FIREBASE_SERVICE_ACCOUNT secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Add Firebase web config
        if: steps.check.outputs.ready == 'true' && env.FIREBASE_WEB_CONFIG != ''
        run: printf 'window.DISCOVER_PS_FIREBASE_CONFIG = %s;\n' "$FIREBASE_WEB_CONFIG" > web/firebase-config.js
      - name: Deploy hosting and Firestore rules
        if: steps.check.outputs.ready == 'true'
        run: |
          key="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx --yes firebase-tools@15 deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$key"
          echo "Website: https://$FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
